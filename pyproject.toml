[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sulcus"
dynamic = ["version"]
description = "Python APIs for the Sulcus agent runtime."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10"
license = "Elastic-2.0"
keywords = ["agents", "llm", "orchestration", "tools", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ElarizT/Sulcus"
Repository = "https://github.com/ElarizT/Sulcus"
Issues = "https://github.com/ElarizT/Sulcus/issues"

[project.optional-dependencies]
dashboard = [
    "rich>=13.7",
    "textual>=0.58",
]
openai = ["openai>=1.55.3", "httpx>=0.23"]
native-dev = ["maturin>=1.9.3", "wasmtime>=20.0"]
dev = [
    "build>=1.2",
    "maturin>=1.9.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "twine>=5.1",
    "rich>=13.7",
    "textual>=0.58",
    "httpx>=0.23",
]

[project.scripts]
sulcus = "sulcus.cli:main"
sulcus-check = "sulcus.cli:runtime_check_main"

[tool.setuptools.dynamic]
version = {attr = "sulcus._version.__version__"}

[tool.setuptools.packages.find]
include = ["sulcus*", "kernel*", "examples.supervised_research_team*"]
exclude = ["tests*", "docs*", "demos*"]

[tool.setuptools.package-data]
"examples.supervised_research_team" = ["sources/*.md"]
